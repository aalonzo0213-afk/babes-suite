<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager's Suite</title>
<style>
  :root {
    --red: #1F4E79;
    --red-bright: #2E6DA4;
    --cream: #FAF3E3;
    --charcoal: #2B2320;
    --gold: #D9A441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--cream);
    font-family: system-ui, -apple-system, sans-serif;
    color: var(--charcoal);
    min-height: 100vh;
  }
  /* Gingham picnic-cloth band */
  .gingham {
    height: 14px;
    background: linear-gradient(180deg, rgba(47,122,140,0.25) 0%, rgba(47,122,140,0) 100%);
  }
  header {
    background: linear-gradient(180deg, #D6483F 0%, #E38249 30%, #EAB588 55%, #8FB3AB 78%, #2F7A8C 100%);
    color: var(--cream);
    padding: 26px 22px 20px;
    text-align: center;
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    letter-spacing: .5px;
  }
  header p {
    margin-top: 5px;
    font-size: 13px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 26px 18px 40px;
    display: grid;
    gap: 22px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(165deg, #ffffff 0%, #fbf6ec 50%, #f2e6d0 100%);
    border: 1px solid rgba(43,35,32,.12);
    border-radius: 14px;
    padding: 18px 18px;
    text-decoration: none;
    color: var(--charcoal);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,1),
      inset 0 -3px 6px rgba(43,35,32,0.08),
      0 2px 4px rgba(43,35,32,.1),
      0 10px 22px rgba(43,35,32,.22);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .card:active {
    transform: scale(.985);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.9),
      inset 0 1px 4px rgba(43,35,32,0.1),
      0 1px 2px rgba(43,35,32,.05);
  }
  .badge {
    flex: 0 0 auto;
    width: 54px;
    height: 54px;
    border-radius: 12px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 24px;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.55),
      inset 0 -4px 6px rgba(0,0,0,0.22),
      inset 2px 0 3px rgba(255,255,255,0.15),
      inset -2px 0 3px rgba(0,0,0,0.1),
      0 3px 6px rgba(0,0,0,0.22),
      0 1px 2px rgba(0,0,0,0.15);
  }
  .badge::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(ellipse at 30% 22%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.15) 32%, rgba(255,255,255,0) 65%);
  }
  .badge span{ position:relative; z-index:1; }
  .card h2 { font-size: 18px; font-family: Georgia, serif; }
  .card span { display: block; margin-top: 3px; font-size: 13.5px; color: #6d615b; }
  footer {
    text-align: center;
    font-size: 12px;
    color: #8a7d75;
    padding-bottom: 24px;
  }
</style>
</head>
<body>

<header>
  <h1>Manager&rsquo;s Suite</h1>
  <p>Front of House</p>
</header>
<div class="gingham"></div>

<main id="cards"></main>

<footer>Tap a tool to open it. Use the back button to return here.</footer>

<script>
  // To add another tool: drop its .html file into assets/ and add one line here.
  const apps = [
    {
      file: "Live_Schedule.html",
      badge: "S",
      name: "Live Schedule",
      desc: "Weekly server schedule, time off, availability & call-out log",
      grad: "#C0503A"
    },
    {
      file: "Safe_Sales_Count.html",
      badge: "$",
      name: "Safe & Sales Count",
      desc: "Daily before/after safe counts, sales & togo tips",
      grad: "#D9A441"
    },
    {
      file: "Table_Server_Count.html",
      badge: "T",
      name: "Table & Server Count",
      desc: "15-minute counts, targets, trends & staffing suggestions",
      grad: "#2F7A8C"
    },
    {
      file: "Catering.html",
      badge: "C",
      name: "Catering",
      desc: "Events, staff assignment, gratuity split & FOH conflict check",
      grad: "#E38249"
    }
  ];

  document.getElementById("cards").innerHTML = apps.map(a => `
    <a class="card" href="${a.file}">
      <div class="badge" style="background:${a.grad};"><span>${a.badge}</span></div>
      <div>
        <h2>${a.name}</h2>
        <span>${a.desc}</span>
      </div>
    </a>
  `).join("");
</script>

</body>
</html>
