<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager's Suite</title>
<style>
  :root {
    --red: #1F4E79;
    --red-bright: #2E6DA4;
    --cream: #FAF3E3;
    --charcoal: #2B2320;
    --gold: #D9A441;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--cream);
    font-family: system-ui, -apple-system, sans-serif;
    color: var(--charcoal);
    min-height: 100vh;
  }
  /* Gingham picnic-cloth band */
  .gingham {
    height: 18px;
    background:
      repeating-linear-gradient(90deg, rgba(31,78,121,.85) 0 14px, rgba(31,78,121,.35) 14px 28px),
      repeating-linear-gradient(0deg, var(--cream) 0 9px, rgba(31,78,121,.25) 9px 18px);
  }
  header {
    background: var(--red);
    color: var(--cream);
    padding: 26px 22px 20px;
    text-align: center;
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 30px;
    letter-spacing: .5px;
  }
  header p {
    margin-top: 5px;
    font-size: 13px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--gold);
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 26px 18px 40px;
    display: grid;
    gap: 16px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #fff;
    border: 1.5px solid rgba(31,78,121,.18);
    border-radius: 14px;
    padding: 18px 18px;
    text-decoration: none;
    color: var(--charcoal);
    box-shadow: 0 2px 6px rgba(43,35,32,.07);
    transition: transform .08s ease;
  }
  .card:active { transform: scale(.985); background: #FFF9EC; }
  .badge {
    flex: 0 0 auto;
    width: 54px;
    height: 54px;
    border-radius: 12px;
    background: var(--red);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 24px;
    border: 2px solid var(--gold);
  }
  .card h2 { font-size: 18px; font-family: Georgia, serif; }
  .card span { display: block; margin-top: 3px; font-size: 13.5px; color: #6d615b; }
  footer {
    text-align: center;
    font-size: 12px;
    color: #8a7d75;
    padding-bottom: 24px;
  }
</style>
</head>
<body>

<header>
  <h1>Manager&rsquo;s Suite</h1>
  <p>Front of House</p>
</header>
<div class="gingham"></div>

<main id="cards"></main>

<footer>Tap a tool to open it. Use the back button to return here.</footer>

<script>
  // To add another tool: drop its .html file into assets/ and add one line here.
  const apps = [
    {
      file: "Babe_Schedule_Mobile.html",
      badge: "S",
      name: "Live Schedule",
      desc: "Weekly server schedule, time off, availability & call-out log"
    },
    {
      file: "Babes_Safe_Sales_Count.html",
      badge: "$",
      name: "Safe & Sales Count",
      desc: "Daily before/after safe counts, sales & togo tips"
    },
    {
      file: "Babes_Table_Server_Count.html",
      badge: "T",
      name: "Table & Server Count",
      desc: "15-minute counts, targets, trends & staffing suggestions"
    }
  ];

  document.getElementById("cards").innerHTML = apps.map(a => `
    <a class="card" href="${a.file}">
      <div class="badge">${a.badge}</div>
      <div>
        <h2>${a.name}</h2>
        <span>${a.desc}</span>
      </div>
    </a>
  `).join("");
</script>

</body>
</html>
